<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — S Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
.edit-form { display: flex; flex-direction: column; gap: 1rem; max-width: 520px; }
.field-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.field { display: flex; flex-direction: column; gap: .4rem; }
.field label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.field input {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .65rem .9rem;
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-size: .9rem;
}
.field input:focus { outline: none; border-color: var(--gold); }
.save-btn {
  align-self: flex-start;
  background: var(--gold);
  color: var(--ink);
  border: none;
  border-radius: 999px;
  padding: .7rem 2rem;
  font-family: 'Jost', sans-serif;
  font-size: .85rem;
  font-weight: 500;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
}
.save-note {
  display: none;
  font-size: .82rem;
  color: var(--gold);
  margin-top: .5rem;
}
</style>
</head>
<body class="dashboard-body">
<a href="#main-content" class="skip-link">Skip to content</a>

<nav class="dash-nav">
  <a href="index.html" class="dash-brand" aria-label="S Collections home">
    <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <polygon points="24,4 44,14 44,34 24,44 4,34 4,14" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
      <text x="24" y="28" text-anchor="middle" font-family="Cinzel,serif" font-size="12" font-weight="700" fill="#c9a84c">SC</text>
    </svg>
    <span>S <em>Collections</em></span>
  </a>
  <div class="dash-nav-right">
    <a href="cart.html" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;color:inherit;text-decoration:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="9" cy="21" r="1.4"/>
        <circle cx="18" cy="21" r="1.4"/>
        <path d="M2.5 3h2.2l2.1 11.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/>
      </svg>
      <span style="position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:#d4a017;color:#1a0a2e;font-family:'DM Sans',sans-serif;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;">3</span>
    </a>
    <span class="dash-user-chip">
        <span class="dash-avatar" aria-hidden="true">AS</span>
        <span class="dash-user-name">Ananya</span>
    </span>
    <a href="dashboard.html" class="btn-logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
    </a>
  </div>
</nav>

<main class="dash-main" id="main-content">
  <div class="dash-container">

    <div class="dash-hero">
      <div class="dash-avatar-lg" aria-hidden="true">AS</div>
      <div>
        <h1 class="dash-welcome">Edit Profile</h1>
        <p class="dash-member">Update your details and delivery address.</p>
      </div>
    </div>

    <section class="dash-section" aria-labelledby="personal-heading">
      <h2 class="dash-section-title" id="personal-heading">Personal Details</h2>
      <form class="edit-form" onsubmit="event.preventDefault(); document.getElementById('saveNote').style.display='block';">
        <div class="field-row">
          <div class="field">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" value="Ananya">
          </div>
          <div class="field">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" value="Sharma">
          </div>
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" value="ananya.sharma@example.com">
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" value="9876543210">
        </div>
        <button type="submit" class="save-btn">Save Changes</button>
        <p class="save-note" id="saveNote">Your changes have been saved.</p>
      </form>
    </section>

    <section class="dash-section" aria-labelledby="address-heading">
      <h2 class="dash-section-title" id="address-heading">Delivery Address</h2>
      <form class="edit-form" onsubmit="event.preventDefault(); document.getElementById('addrNote').style.display='block';">
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" value="14 Rajpur Road">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" value="Dehradun">
          </div>
          <div class="field">
            <label for="state">State</label>
            <input type="text" id="state" value="Uttarakhand">
          </div>
        </div>
        <div class="field">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" value="248001">
        </div>
        <button type="submit" class="save-btn">Save Address</button>
        <p class="save-note" id="addrNote">Your address has been saved.</p>
      </form>
    </section>

  </div>
</main>

</body>
</html>
